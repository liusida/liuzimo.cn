<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Engine Sound Simulator</title>
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
    <link rel="stylesheet" href="./styles.css" />
    <style>
    .home-favicon-link {
      position: fixed;
      top: 1rem;
      left: 1rem;
      z-index: 20;
      width: 2rem;
      height: 2rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      border: 1px solid rgba(7, 8, 13, 0.45);
      background: rgba(244, 242, 237, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: transform 0.2s, border-color 0.2s, background 0.2s;
    }
    .home-favicon-link:hover {
      transform: scale(1.06);
      border-color: rgba(244, 242, 237, 0.65);
      background: rgba(7, 8, 13, 0.88);
    }
    .home-favicon-link:hover img { filter: invert(1); }
    .home-favicon-link:focus-visible {
      outline: 2px solid rgba(140, 170, 255, 0.45);
      outline-offset: 2px;
    }
    .home-favicon-link img {
      width: 1.15rem;
      height: 1.15rem;
      display: block;
      filter: none;
    }
    </style>
  </head>
  <body>
    <a class="home-favicon-link" href="../../index.html" aria-label="Go to homepage">
      <img src="../../favicon.svg" alt="">
    </a>
    <main class="app">
      <section class="panel">
        <h1>Real-Time Engine Sound Simulator</h1>
        <p>
          Controls: <kbd>W</kbd> throttle, <kbd>S</kbd> brake/load, <kbd>Q</kbd> clutch,
          <kbd>E</kbd> toggle limiter, <kbd>A</kbd>/<kbd>D</kbd> shift down/up,
          <kbd>C</kbd> switch camera, <kbd>Z</kbd>/<kbd>X</kbd> distance near/far.
        </p>
        <div class="row">
          <button id="audio-toggle" type="button">Start Audio</button>
          <button id="camera-toggle" type="button">Camera: Exterior</button>
          <button id="engine-toggle" type="button">Engine: Off</button>
        </div>
      </section>
      <section class="panel">
        <h2>Debug</h2>
        <pre id="debug-output">Waiting for audio initialization...</pre>
      </section>
    </main>
    <script type="module" src="./src/main.js"></script>
    <script src="../../assets/js/back-to-top.js?v=1" defer></script>
</body>
</html>
