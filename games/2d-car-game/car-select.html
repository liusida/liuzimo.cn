<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choose Your Car</title>
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
    <link rel="stylesheet" href="./car-select.css" />
    <style>
    .home-favicon-link {
      position: fixed;
      top: 1rem;
      left: 1rem;
      z-index: 20;
      width: 2rem;
      height: 2rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      border: 1px solid rgba(7, 8, 13, 0.45);
      background: rgba(244, 242, 237, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: transform 0.2s, border-color 0.2s, background 0.2s;
    }
    .home-favicon-link:hover {
      transform: scale(1.06);
      border-color: rgba(244, 242, 237, 0.65);
      background: rgba(7, 8, 13, 0.88);
    }
    .home-favicon-link:hover img { filter: invert(1); }
    .home-favicon-link:focus-visible {
      outline: 2px solid rgba(140, 170, 255, 0.45);
      outline-offset: 2px;
    }
    .home-favicon-link img {
      width: 1.15rem;
      height: 1.15rem;
      display: block;
      filter: none;
    }
    </style>
  </head>
  <body>
    <a class="home-favicon-link" href="../../index.html" aria-label="Go to homepage">
      <img src="../../favicon.svg" alt="">
    </a>
    <main class="chooser-shell">
      <h1>Choose Your Car</h1>
      <p class="subtext">Pick your ride, then go back and start the run.</p>
      <div class="addon-row">
        <label class="addon-label">
          <input id="trailerToggle" type="checkbox" />
          Truck Trailer Add-on
        </label>
        <span class="addon-note">Only applies when you pick a truck.</span>
      </div>
      <section id="carGrid" class="car-grid" aria-label="car choices"></section>
      <a class="back-btn" href="./index.html">Back to Game</a>
    </main>

    <script src="./car-select.js?v=3"></script>
    <script src="../../assets/js/back-to-top.js?v=1" defer></script>
</body>
</html>
